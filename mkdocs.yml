site_name: База знаний по таргету
site_description: Targeted ads knowledge base — Meta, TikTok
site_url: https://rem700.github.io/target-kb/
repo_url: https://github.com/rem700/target-kb
repo_name: rem700/target-kb
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: ru
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - navigation.sections
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light }

hooks:
  - hooks/page_description.py

nav:
  - index.md
  - Старт:
      - 01-basics.md
      - glossary.md
      - interface-terms.md
      - platforms.md
      - setup.md
      - billing.md
  - Запуск рекламы:
      - 02-meta.md
      - audiences.md
      - 03-creatives.md
      - video.md
      - copywriting.md
      - multilingual.md
      - landing.md
      - messaging.md
      - placements.md
      - 04-tracking.md
      - 06-tiktok.md
  - Рост и анализ:
      - reports.md
      - 05-testing.md
      - benchmarks.md
      - calendar.md
      - organic-paid.md
      - ai-tools.md
      - 08-hidden.md
  - Практика:
      - case-study.md
      - playbooks.md
      - templates.md
      - contractors.md
      - 09-problem-cases.md
  - Правила:
      - 07-restrictions.md
      - legal.md
  - 99-changelog.md

plugins:
  - search:
      lang: [ru, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
          site_name: База знаний по таргету
        - locale: en
          name: English
          build: true
          site_name: Targeted Ads Knowledge Base
          nav_translations:
            Старт: Getting started
            Запуск рекламы: Launching ads
            Рост и анализ: Growth and analysis
            Практика: Practice
            Правила: Rules
        - locale: uk
          name: Українська
          build: true
          site_name: База знань з таргету
          nav_translations:
            Старт: Старт
            Запуск рекламы: Запуск реклами
            Рост и анализ: Зростання та аналіз
            Практика: Практика
            Правила: Правила
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: false

markdown_extensions:
  - admonition
  - tables
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - abbr
  - attr_list
  - pymdownx.snippets:
      base_path: [includes]
      check_paths: true
